<div class="auth-container">
  <div class="auth-card glass-panel" style="max-width: 450px;">
    <div class="auth-header">
      <h2>Create an Account</h2>
      <p>Join BookNest today.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" formControlName="fullName" placeholder="Enter your full name"
               [class.invalid]="registerForm.get('fullName')?.invalid && registerForm.get('fullName')?.touched">
        <span class="error-msg" *ngIf="registerForm.get('fullName')?.invalid && registerForm.get('fullName')?.touched">
          Full Name is required.
        </span>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" formControlName="email" placeholder="Enter your email"
               [class.invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
        <span class="error-msg" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          Please enter a valid email.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="Create a password"
               [class.invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
        <span class="error-msg" *ngIf="registerForm.get('password')?.errors?.['required'] && registerForm.get('password')?.touched">
          Password is required.
        </span>
        <span class="error-msg" *ngIf="registerForm.get('password')?.errors?.['minlength'] && registerForm.get('password')?.touched">
          Password must be at least 6 characters.
        </span>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="text" id="mobile" formControlName="mobile" placeholder="Enter 10 digit number"
               [class.invalid]="registerForm.get('mobile')?.invalid && registerForm.get('mobile')?.touched">
        <span class="error-msg" *ngIf="registerForm.get('mobile')?.invalid && registerForm.get('mobile')?.touched">
          Please enter a valid 10-digit mobile number.
        </span>
      </div>

      <div class="form-group">
        <label for="role">Register As</label>
        <select id="role" formControlName="role">
          <option value="CUSTOMER">Customer</option>
          <option value="ADMIN">Administrator</option>
        </select>
      </div>

      <div class="error-alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
      
      <div class="success-alert" *ngIf="successMessage" style="background: #dcfce7; color: #166534; padding: 0.75rem; border-radius: 8px; text-align: center; margin-bottom: 1.5rem; font-size: 0.875rem;">
        {{ successMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || isLoading">
        <span *ngIf="!isLoading">Sign Up</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign In</a></p>
    </div>
  </div>
</div>
