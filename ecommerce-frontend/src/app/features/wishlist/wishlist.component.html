<div class="wishlist-container">
  <div class="wishlist-header">
    <h1>Your Wishlist</h1>
    <div class="header-actions" *ngIf="wishlist && wishlist.items && wishlist.items.length > 0">
      <span class="item-count">{{ wishlist.totalItems }} Saved Item(s)</span>
      <button class="clear-btn" (click)="clearWishlist()" [disabled]="isUpdating">Clear All</button>
    </div>
  </div>

  <div *ngIf="isLoading" style="text-align: center; padding: 4rem;">
    <span class="spinner" style="border-top-color: var(--primary-color); display: inline-block; width: 40px; height: 40px;"></span>
  </div>

  <div *ngIf="!isLoading">
    
    <!-- Empty State -->
    <div *ngIf="!wishlist || !wishlist.items || wishlist.items.length === 0" class="empty-wishlist glass-panel">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
      <h2>Your wishlist is currently empty.</h2>
      <p>Save items you'd like to buy later by clicking the heart icon on any book.</p>
      <a routerLink="/catalog" class="btn-primary" style="text-decoration: none; display: inline-block; margin-top: 1rem;">Browse Books</a>
    </div>

    <!-- Active Wishlist Grid -->
    <div *ngIf="wishlist && wishlist.items && wishlist.items.length > 0" class="wishlist-grid">
      <div *ngFor="let item of wishlist.items" class="wishlist-card glass-panel" [class.updating]="isUpdating">
        <button class="remove-icon-btn" (click)="removeItem(item)" title="Remove from Wishlist">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        
        <div class="card-img">
          <img [src]="item.bookCoverImage || 'assets/placeholder-book.png'" alt="{{ item.bookTitle }}">
        </div>
        
        <div class="card-content">
          <a [routerLink]="['/books', item.bookId]" class="book-title">{{ item.bookTitle }}</a>
          <p class="book-author">{{ item.bookAuthor }}</p>
          <div class="book-price">${{ item.bookPrice | number:'1.2-2' }}</div>
          
          <button class="btn-primary btn-move-cart" (click)="moveToCart(item)" [disabled]="isUpdating">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            Move to Cart
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
