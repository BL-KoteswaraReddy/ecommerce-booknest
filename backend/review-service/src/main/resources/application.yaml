spring:
  application:
    name: review-service

  datasource:
    url: jdbc:mysql://localhost:3306/booknest_review_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ASDF1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8088

logging:
  level:
    com.booknest: DEBUG

services:
  book:
    url: http://localhost:8081
  order:
    url: http://localhost:8083

review:
  max-length: 2000
  min-rating: 1
  max-rating: 5