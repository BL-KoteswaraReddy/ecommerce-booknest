server:
  port: 8085

spring:
  application:
    name: wishlist-service

  datasource:
    url: jdbc:mysql://localhost:3306/wishlist_service?createDatabaseIfNotExist=true
    username: root
    password: ASDF1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

app:
  internal:
    secret: 12345

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost

services:
  book:
    url: http://localhost:8081
  cart:
    url: http://localhost:8082

logging:
  level:
    root: INFO